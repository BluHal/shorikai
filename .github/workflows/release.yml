name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  macos:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Shorikai v__VERSION__
          releaseBody: Download the macOS DMG below.
          releaseAssetNamePattern: Shorikai_[version]_universal[ext]
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin
